<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0B192C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Location Pin Base -->
  <path d="M50 8 C31.2 8 16 23.2 16 42 C16 63 44 88 47.8 91.2 C49.1 92.3 50.9 92.3 52.2 91.2 C56 88 84 63 84 42 C84 23.2 68.8 8 50 8 Z" 
        fill="url(#navyGrad)" 
        filter="url(#softShadow)" />

  <!-- Inner Teal Accent Circle -->
  <circle cx="50" cy="40" r="24" fill="url(#pinGrad)"/>

  <!-- Crisp White Check Mark -->
  <path d="M40 40 L47 47 L61 32" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
